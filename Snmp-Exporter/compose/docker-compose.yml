---
services:
  snmp-exporter:
    image: quay.io/prometheus/snmp-exporter
    container_name: snmp-exporter
    ports:
      - "9116:9116"
    volumes:
      - /home/srcadm/apps/snmp-exporter/data:/etc/snmp_exporter
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    restart: unless-stopped
