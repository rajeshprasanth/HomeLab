---
services:
  postgresql:
    image: postgres:16
    container_name: authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${PG_PASS}"
      POSTGRES_DB: authentik
    volumes:
      - /home/srcadm/apps/authentik/data/authentik-db:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: authentik-redis
    restart: unless-stopped
    volumes:
      - /home/srcadm/apps/authentik/data/authentik-redis:/data

  server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    command: server
    restart: unless-stopped
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${PG_PASS}"
    volumes:
      - /home/srcadm/apps/authentik/data/authentik-media:/media
      - /home/srcadm/apps/authentik/data/authentik-custom-templates:/templates
    depends_on:
      - postgresql
      - redis
    ports:
      - "2000:9000"
      - "2443:9443"

  worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${PG_PASS}"
    volumes:
      - /home/srcadm/apps/authentik/data/authentik-media:/media
      - /home/srcadm/apps/authentik/data/authentik-custom-templates:/templates
    depends_on:
      - postgresql
      - redis
