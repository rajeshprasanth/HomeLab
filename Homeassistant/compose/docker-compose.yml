---
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host   # recommended for full device discovery (mDNS, UPnP, etc.)
    ports:
      - "8123:8123"   # host:container
    privileged: true
    volumes:
      - /home/srcadm/apps/homeassistant/data:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Kolkata   # set your timezone
