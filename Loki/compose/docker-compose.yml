---
services:
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config/config.yml
    volumes:
      - /home/srcadm/apps/loki/data/loki-config.yaml:/etc/loki/config/config.yml:ro
      - /home/srcadm/apps/loki/data:/loki

    restart: unless-stopped
