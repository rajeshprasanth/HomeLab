---
services:
  monitoring:
    image: checkmk/check-mk-community:2.5.0p14
    container_name: checkmk
    restart: unless-stopped

    ports:
      - "2080:5000"
      - "2000:8000"

    volumes:
      - /home/srcadm/apps/checkmk/data:/omd/sites
      - /etc/localtime:/etc/localtime:ro

    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
