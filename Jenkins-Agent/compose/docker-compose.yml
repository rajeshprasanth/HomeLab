---
services:
  jenkins-agent:
    image: jenkins/inbound-agent:latest
    container_name: jenkins-agent
    user: root
    restart: unless-stopped
    volumes:
      - /home/srcadm/apps/jenkins-agent/data:/home/jenkins  # Persist workspace & config if needed
    environment:
      - JENKINS_URL=http://10.0.0.93:8081
      - JENKINS_AGENT_NAME=dc01plpmon002.rphomelab.in
      - JENKINS_SECRET=${JENKINS_SECRET_KEY}
